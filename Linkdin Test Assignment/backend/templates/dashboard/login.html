<!-- templates/dashboard/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Roboto', sans-serif;
            background: #F0F0F0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        /* Matches Flutter Card(elevation:12, borderRadius:20) */
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 32px 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.18);
        }

        /* Matches Flutter Icon(Icons.shopping_cart, size:72, color:Colors.indigo) */
        .cart-icon {
            text-align: center;
            margin-bottom: 16px;
        }
        .cart-icon svg {
            width: 72px; height: 72px;
            fill: #3F51B5;
        }

        /* Matches Flutter Text('Welcome Back!', fontSize:24, fontWeight:bold) */
        h2 {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #212121;
            margin-bottom: 6px;
        }

        /* Matches Flutter Text('Login to your account', fontSize:14, color:Colors.grey) */
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #9E9E9E;
            margin-bottom: 28px;
        }

        .error-msg {
            background: #FFEBEE;
            border: 1px solid #EF9A9A;
            color: #C62828;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group { margin-bottom: 16px; }

        /* Matches Flutter OutlineInputBorder */
        .input-wrap {
            position: relative;
            border: 1px solid #BDBDBD;
            border-radius: 4px;
            background: white;
            transition: border-color 0.15s;
        }
        .input-wrap:focus-within { border: 2px solid #3F51B5; }
        .input-wrap:focus-within .floating-label { color: #3F51B5; }

        /* Matches Flutter labelText floating label */
        .floating-label {
            position: absolute;
            left: 48px; top: -9px;
            font-size: 12px;
            font-weight: 500;
            color: #9E9E9E;
            background: white;
            padding: 0 4px;
            pointer-events: none;
        }

        /* Matches Flutter prefixIcon */
        .prefix-icon {
            position: absolute;
            left: 12px; top: 50%;
            transform: translateY(-50%);
            display: flex; align-items: center;
        }
        .prefix-icon svg { width: 22px; height: 22px; fill: #9E9E9E; }

        /* Matches Flutter suffixIcon visibility toggle */
        .suffix-icon {
            position: absolute;
            right: 10px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            cursor: pointer; padding: 4px;
            display: flex; align-items: center;
        }
        .suffix-icon svg { width: 22px; height: 22px; fill: #757575; }

        .form-control {
            width: 100%;
            padding: 16px 44px 14px 48px;
            border: none; border-radius: 4px;
            background: transparent;
            font-size: 15px;
            font-family: 'Roboto', sans-serif;
            color: #212121;
            outline: none;
        }
        .form-control.has-suffix { padding-right: 48px; }

        /* Matches Flutter ElevatedButton(padding vertical:16, borderRadius:12) */
        .btn-login {
            width: 100%;
            padding: 16px;
            background: #3F51B5;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 500;
            font-family: 'Roboto', sans-serif;
            cursor: pointer;
            transition: background 0.15s;
            box-shadow: 0 2px 8px rgba(63,81,181,0.3);
        }
        .btn-login:hover { background: #303F9F; }

        /* Matches Flutter OutlinedButton(padding vertical:16, borderRadius:12) */
        .btn-register {
            width: 100%;
            padding: 15px;
            background: white;
            border: 1px solid #BDBDBD;
            border-radius: 12px;
            color: #3F51B5;
            font-size: 16px;
            font-weight: 500;
            font-family: 'Roboto', sans-serif;
            cursor: pointer;
            margin-top: 12px;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: all 0.15s;
        }
        .btn-register:hover { background: #E8EAF6; border-color: #3F51B5; }

        .admin-note {
            text-align: center;
            font-size: 12px;
            color: #BDBDBD;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #F5F5F5;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-card">

        <!-- Shopping cart icon matching Flutter Icon(Icons.shopping_cart, size:72, color:Colors.indigo) -->
        <div class="cart-icon">
            <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96C5 16.1 5.9 17 7 17h14v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63H19c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0023.41 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </div>

        <!-- Matches Flutter Text('Welcome Back!') -->
        <h2>Welcome Back!</h2>
        <p class="subtitle">Login to your account</p>

        {% if messages %}
            {% for message in messages %}
            <div class="error-msg">❌ {{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" id="loginForm">
            {% csrf_token %}

            <!-- Username — matches Flutter TextFormField(labelText:"Username", prefixIcon:Icons.person) -->
            <div class="form-group">
                <div class="input-wrap">
                    <span class="floating-label">Username</span>
                    <span class="prefix-icon">
                        <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
                    </span>
                    <input type="text" name="username" class="form-control"
                           placeholder="Enter username" required autofocus>
                </div>
            </div>

            <!-- Password — matches Flutter TextFormField(labelText:"Password", prefixIcon:Icons.lock, suffixIcon:visibility toggle) -->
            <div class="form-group">
                <div class="input-wrap">
                    <span class="floating-label">Password</span>
                    <span class="prefix-icon">
                        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/></svg>
                    </span>
                    <input type="password" name="password" id="passwordInput"
                           class="form-control has-suffix"
                           placeholder="Enter password" required>
                    <button type="button" class="suffix-icon" onclick="togglePassword()">
                        <svg id="eyeIcon" viewBox="0 0 24 24">
                            <path id="eyePath" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Login button — matches Flutter ElevatedButton -->
            <button type="submit" class="btn-login" id="loginBtn">Login</button>

            <!-- Register button — matches Flutter OutlinedButton (disabled for admin panel) -->
            <a href="#" class="btn-register" onclick="showNote(event)">Register New User</a>
        </form>

        <p class="admin-note" id="adminNote" style="display:none;">
            🛡️ This is the admin panel. User registration is handled via the mobile app.
        </p>

        <p class="admin-note">🛡️ Admin Web Dashboard</p>
    </div>

    <script>
        let visible = false;
        function togglePassword() {
            visible = !visible;
            document.getElementById('passwordInput').type = visible ? 'text' : 'password';
            document.getElementById('eyePath').setAttribute('d', visible
                ? 'M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46A11.8 11.8 0 001 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z'
                : 'M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z'
            );
        }

        function showNote(e) {
            e.preventDefault();
            document.getElementById('adminNote').style.display = 'block';
        }

        document.getElementById('loginForm').addEventListener('submit', function() {
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<span style="display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.4);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px;"></span>Loading...';
            btn.disabled = true;
        });
    </script>
</body>
</html>

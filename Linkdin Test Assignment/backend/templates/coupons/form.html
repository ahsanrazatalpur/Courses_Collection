{% extends 'dashboard/base.html' %}
{% block title %}{{ action }} Coupon{% endblock %}

{% block content %}
<div style="max-width:600px; margin:0 auto;">

  <div style="display:flex; align-items:center; gap:12px; margin-bottom:24px;">
    <a href="{% url 'coupon_list' %}" style="background:#3F51B5;color:white;padding:8px 14px;border-radius:8px;text-decoration:none;font-size:13px;">← Back</a>
    <h2 style="margin:0; color:#3F51B5;">🏷️ {{ action }} Coupon</h2>
  </div>

  {% if messages %}
    {% for msg in messages %}
      <div style="background:{% if msg.tags == 'error' %}#fde8e8{% else %}#e8f5e9{% endif %};border:1px solid {% if msg.tags == 'error' %}#f44336{% else %}#4CAF50{% endif %};padding:12px 16px;border-radius:8px;margin-bottom:16px;color:{% if msg.tags == 'error' %}#c62828{% else %}#2e7d32{% endif %};">
        {{ msg }}
      </div>
    {% endfor %}
  {% endif %}

  <div style="background:white;border-radius:12px;padding:28px;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
    <form method="POST">
      {% csrf_token %}

      <!-- Code -->
      <div style="margin-bottom:16px;">
        <label style="display:block;font-weight:600;margin-bottom:6px;color:#424242;">Coupon Code *</label>
        <input type="text" name="code" value="{{ coupon.code|default:'' }}" required
               placeholder="e.g. SAVE20"
               style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;text-transform:uppercase;box-sizing:border-box;">
      </div>

      <!-- Discount Type -->
      <div style="margin-bottom:16px;">
        <label style="display:block;font-weight:600;margin-bottom:6px;color:#424242;">Discount Type *</label>
        <select name="discount_type" style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;box-sizing:border-box;">
          <option value="percentage" {% if coupon.discount_type == 'percentage' %}selected{% endif %}>Percentage (%)</option>
          <option value="flat"       {% if coupon.discount_type == 'flat' %}selected{% endif %}>Flat Amount (Rs)</option>
        </select>
      </div>

      <!-- Discount Value -->
      <div style="margin-bottom:16px;">
        <label style="display:block;font-weight:600;margin-bottom:6px;color:#424242;">Discount Value *</label>
        <input type="number" name="discount_value" value="{{ coupon.discount_value|default:'' }}" required
               step="0.01" min="0" placeholder="e.g. 20"
               style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;box-sizing:border-box;">
      </div>

      <!-- Min Cart Value -->
      <div style="margin-bottom:16px;">
        <label style="display:block;font-weight:600;margin-bottom:6px;color:#424242;">Minimum Cart Value (Rs)</label>
        <input type="number" name="minimum_cart_value" value="{{ coupon.minimum_cart_value|default:'0' }}"
               step="0.01" min="0" placeholder="0 = no minimum"
               style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;box-sizing:border-box;">
      </div>

      <!-- Usage Limit -->
      <div style="margin-bottom:16px;">
        <label style="display:block;font-weight:600;margin-bottom:6px;color:#424242;">Usage Limit</label>
        <input type="number" name="usage_limit" value="{{ coupon.usage_limit|default:'' }}"
               min="1" placeholder="Leave empty = unlimited"
               style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;box-sizing:border-box;">
      </div>

      <!-- Dates -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
        <div>
          <label style="display:block;font-weight:600;margin-bottom:6px;color:#424242;">Start Date *</label>
          <input type="datetime-local" name="start_date"
                 value="{% if coupon.start_date %}{{ coupon.start_date|date:'Y-m-d' }}T{{ coupon.start_date|date:'H:i' }}{% endif %}"
                 required style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;box-sizing:border-box;">
        </div>
        <div>
          <label style="display:block;font-weight:600;margin-bottom:6px;color:#424242;">End Date *</label>
          <input type="datetime-local" name="end_date"
                 value="{% if coupon.end_date %}{{ coupon.end_date|date:'Y-m-d' }}T{{ coupon.end_date|date:'H:i' }}{% endif %}"
                 required style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;box-sizing:border-box;">
        </div>
      </div>

      <!-- Active -->
      <div style="margin-bottom:24px;display:flex;align-items:center;gap:10px;background:#f5f5f5;padding:12px 16px;border-radius:8px;">
        <input type="checkbox" name="is_active" id="is_active"
               {% if coupon.is_active or action == 'Add' %}checked{% endif %}
               style="width:18px;height:18px;cursor:pointer;">
        <label for="is_active" style="font-weight:600;color:#424242;cursor:pointer;">Active (coupon can be used)</label>
      </div>

      <!-- Buttons -->
      <div style="display:flex;gap:12px;">
        <button type="submit"
                style="flex:1;background:#3F51B5;color:white;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;">
          {% if action == 'Add' %}✅ Create Coupon{% else %}💾 Update Coupon{% endif %}
        </button>
        <a href="{% url 'coupon_list' %}"
           style="flex:1;background:#f5f5f5;color:#424242;padding:12px;border-radius:8px;font-size:15px;font-weight:600;text-decoration:none;text-align:center;display:block;">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
